[phases.setup]
nixPkgs = [
  "php84",
  "php84Extensions.pdo_mysql",
  "php84Extensions.curl",
  "php84Extensions.mbstring",
  "php84Extensions.xml",
  "php84Extensions.zip",
  "php84Extensions.tokenizer",
  "php84Extensions.fileinfo",
  "php84Extensions.openssl",
  "composer",
  "nodejs_20",
  "nodePackages.npm"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-scripts --no-interaction",
  "npm ci"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "php artisan config:cache && php artisan route:cache && php artisan migrate --force && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=$PORT"
